name: Validate Craft rebuild fix

on:
  push:
    branches:
      - codex/fix-validation

permissions:
  contents: read

jobs:
  validate-production-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -Eeuo pipefail
          : "${OVH_DEPLOY_KEY:?Missing OVH_DEPLOY_KEY}"
          : "${OVH_HOST:?Missing OVH_HOST}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          printf 'known_hosts_b64='
          base64 -w0 ~/.ssh/known_hosts
          printf '\n'

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Verify roots and initialize one-time markers
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_TARGET_DIR: ${{ secrets.OVH_TARGET_DIR }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${OVH_HOST:?Missing OVH_HOST}"
          : "${OVH_USER:?Missing OVH_USER}"
          : "${OVH_TARGET_DIR:?Missing OVH_TARGET_DIR}"
          [[ "$OVH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "invalid OVH_HOST format" >&2; exit 1; }
          [[ "$OVH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid OVH_USER format" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" =~ ^(~/|/?)[A-Za-z0-9._/-]+$ ]] || { echo "invalid OVH_TARGET_DIR format (length ${#OVH_TARGET_DIR})" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" != "/" && "$OVH_TARGET_DIR" != "." && "$OVH_TARGET_DIR" != ".." ]] || { echo "OVH_TARGET_DIR resolves to an unsafe broad target" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" != *"//"* ]] || { echo "OVH_TARGET_DIR contains a repeated separator" >&2; exit 1; }
          case "$OVH_TARGET_DIR" in
            ../*|*/../*|*/..|./*|*/./*|*/.) echo "OVH_TARGET_DIR contains path traversal or dot segments" >&2; exit 1 ;;
          esac

          SSH_TARGET="${OVH_USER}@${OVH_HOST}"
          REMOTE_HOME="$(ssh "$SSH_TARGET" 'cd && pwd -P')"
          [[ "$REMOTE_HOME" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "unexpected resolved remote home" >&2; exit 1; }
          if [[ "$OVH_TARGET_DIR" == "~/"* ]]; then
            TARGET_FOR_CD="$REMOTE_HOME/${OVH_TARGET_DIR#\~/}"
          else
            TARGET_FOR_CD="$OVH_TARGET_DIR"
          fi
          REMOTE_TARGET="$(ssh "$SSH_TARGET" "cd -- '$TARGET_FOR_CD' && pwd -P")"
          REMOTE_CRAFT="$(ssh "$SSH_TARGET" 'cd "$HOME/craft" && pwd -P')"

          [[ "$REMOTE_TARGET" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "unexpected resolved static target" >&2; exit 1; }
          [[ "$REMOTE_CRAFT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "unexpected resolved Craft target" >&2; exit 1; }
          [[ "$REMOTE_TARGET" != "$REMOTE_HOME" && "$REMOTE_TARGET" == "$REMOTE_HOME/"* ]] || { echo "static target is not a child of remote home" >&2; exit 1; }
          [[ "$REMOTE_CRAFT" == "$REMOTE_HOME/craft" ]] || { echo "Craft target is not the expected remote-home child" >&2; exit 1; }
          [[ "$REMOTE_TARGET" != "$REMOTE_CRAFT" && "$REMOTE_TARGET" != "$REMOTE_CRAFT/"* && "$REMOTE_CRAFT" != "$REMOTE_TARGET/"* ]] || { echo "static and Craft targets overlap" >&2; exit 1; }

          ssh "$SSH_TARGET" "bash -s -- '$REMOTE_TARGET' '$REMOTE_CRAFT' '${GITHUB_RUN_ID}'" <<'REMOTE'
          set -Eeuo pipefail
          REMOTE_TARGET="$1"
          REMOTE_CRAFT="$2"
          RUN_ID="$3"

          test -d "$REMOTE_TARGET/cms" || { echo "missing public cms directory" >&2; exit 1; }
          test -f "$REMOTE_TARGET/cms/index.php" || { echo "missing public cms index" >&2; exit 1; }
          test -f "$REMOTE_CRAFT/.env" || { echo "missing Craft .env" >&2; exit 1; }
          test -f "$REMOTE_CRAFT/config/app.php" || { echo "missing Craft app config" >&2; exit 1; }
          test -f "$REMOTE_CRAFT/craft" || { echo "missing Craft executable" >&2; exit 1; }
          test -f "$REMOTE_CRAFT/vendor/autoload.php" || { echo "missing Craft autoloader" >&2; exit 1; }
          echo "production shape verified"

          APP_HASH="$(sha256sum "$REMOTE_CRAFT/config/app.php" | awk '{print $1}')"
          test "$APP_HASH" = "8df5939ca8625f68ba5a85add3f83222e40d927024127a824240be62c44ad05f" || { echo "unexpected app config hash: $APP_HASH" >&2; exit 1; }
          echo "production app config verified"

          if [ -e "$REMOTE_TARGET/.val-dieu-deploy-root" ]; then
            grep -qxF 'val-dieu-static-root-v1' "$REMOTE_TARGET/.val-dieu-deploy-root" || { echo "invalid static root marker" >&2; exit 1; }
          else
            printf '%s\n' 'val-dieu-static-root-v1' > "$REMOTE_TARGET/.val-dieu-deploy-root"
            chmod 0644 "$REMOTE_TARGET/.val-dieu-deploy-root"
          fi

          if [ -e "$REMOTE_CRAFT/.val-dieu-craft-root" ]; then
            grep -qxF 'val-dieu-craft-root-v1' "$REMOTE_CRAFT/.val-dieu-craft-root" || { echo "invalid Craft root marker" >&2; exit 1; }
          else
            printf '%s\n' 'val-dieu-craft-root-v1' > "$REMOTE_CRAFT/.val-dieu-craft-root"
            chmod 0644 "$REMOTE_CRAFT/.val-dieu-craft-root"
          fi
          echo "one-time root markers verified"

          STAGE="$HOME/.val-dieu-fix-validation/$RUN_ID"
          umask 077
          mkdir -p "$STAGE/config" "$STAGE/modules/githubdispatch/jobs"
          printf 'stage=%s\n' "$STAGE"
          REMOTE

          rsync -az cms/config/app.php "$SSH_TARGET:.val-dieu-fix-validation/${GITHUB_RUN_ID}/config/"
          rsync -az cms/modules/githubdispatch/ "$SSH_TARGET:.val-dieu-fix-validation/${GITHUB_RUN_ID}/modules/githubdispatch/"

      - name: Lint and load the integration on production PHP
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${OVH_USER}@${OVH_HOST}"
          ssh "$SSH_TARGET" "bash -s -- '${GITHUB_RUN_ID}'" <<'REMOTE'
          set -Eeuo pipefail
          STAGE="$HOME/.val-dieu-fix-validation/$1"
          CRAFT_DIR="$HOME/craft"

          php -l "$STAGE/config/app.php"
          php -l "$STAGE/modules/githubdispatch/Module.php"
          php -l "$STAGE/modules/githubdispatch/jobs/DispatchRepository.php"

          cd "$CRAFT_DIR"
          VALIDATION_STAGE="$STAGE" php craft exec/exec '(function() { $stage = getenv("VALIDATION_STAGE"); require_once $stage . "/modules/githubdispatch/jobs/DispatchRepository.php"; require_once $stage . "/modules/githubdispatch/Module.php"; $job = new modules\githubdispatch\jobs\DispatchRepository(); $module = new modules\githubdispatch\Module("github-dispatch-validation"); return json_encode(["module" => $module::class, "retry_initial" => $job->canRetry(1, null), "retry_transient" => $job->canRetry(1, new modules\githubdispatch\jobs\DispatchFailed(true, "safe")), "retry_permanent" => $job->canRetry(1, new modules\githubdispatch\jobs\DispatchFailed(false, "safe")), "retry_limit" => $job->canRetry(3, null)]); })()' --interactive=0 --color=0
          php craft exec/exec '(function() { $db = Craft::$app->getDb(); $safeCounts = $db->createCommand("SELECT COUNT(*) AS total, COALESCE(SUM([[fail]] = 1), 0) AS failed, COALESCE(SUM([[fail]] = 0 AND [[dateReserved]] IS NULL), 0) AS pending, COALESCE(SUM([[fail]] = 0 AND [[dateReserved]] IS NOT NULL), 0) AS reserved, COALESCE(MAX([[attempt]]), 0) AS max_attempt FROM {{%queue}}")->queryOne(); return json_encode(["runQueueAutomatically" => Craft::$app->getConfig()->getGeneral()->runQueueAutomatically, "queue" => array_map("intval", $safeCounts)]); })()' --interactive=0 --color=0
          REMOTE
