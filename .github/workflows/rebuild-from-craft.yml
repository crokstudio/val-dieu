name: Rebuild from Craft

on:
  push:
    branches:
      - main
      - codex/production-diagnostic
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Inspect and back up Craft production without deploying
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - craft-content-saved

concurrency:
  group: static-site-deploy
  cancel-in-progress: true

jobs:
  diagnose-ovh:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostics_only) || github.ref == 'refs/heads/codex/production-diagnostic' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect and back up Craft production
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -eu

          craft_dir="$HOME/craft"
          env_file="$craft_dir/.env"
          public_cms="$HOME/www/cms"

          test -d "$craft_dir"
          test -f "$env_file"
          test -d "$public_cms"

          echo "craft_root_present=true"
          echo "public_cms_present=true"
          stat -c 'craft_env_mtime=%y' "$env_file"
          stat -c 'craft_app_config_mtime=%y' "$craft_dir/config/app.php"

          if grep -Eq '^[[:space:]]*GITHUB_DISPATCH_TOKEN=.+$' "$env_file"; then
            echo "github_dispatch_token=present"
          else
            echo "github_dispatch_token=absent"
          fi

          integration_keys="$(sed -n -E 's/^[[:space:]]*([A-Z0-9_]*(GITHUB|DISPATCH|WEBHOOK)[A-Z0-9_]*)=.*/\1/p' "$env_file" | sort -u | paste -sd, -)"
          if [ -n "$integration_keys" ]; then
            echo "integration_env_keys=$integration_keys"
          else
            echo "integration_env_keys=none"
          fi

          cd "$craft_dir"
          before_count="$(find storage/backups -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
          php craft db/backup storage/backups/ --interactive=0 --color=0 >/dev/null
          after_count="$(find storage/backups -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "craft_backup_created=$([ "$after_count" -gt "$before_count" ] && echo true || echo false)"
          echo "craft_backup_count=$after_count"

          php craft exec/exec '$db = Craft::$app->getDb(); $out = []; foreach ($db->getSchema()->getTableNames() as $name) { if (str_contains($name, "webhook")) { $out[$name] = (int)$db->createCommand("SELECT COUNT(*) FROM " . $db->quoteTableName($name))->queryScalar(); } } return json_encode($out);' --interactive=0 --color=0
          REMOTE

  build:
    if: ${{ github.ref != 'refs/heads/codex/production-diagnostic' && !(github.event_name == 'workflow_dispatch' && inputs.diagnostics_only) }}
    runs-on: ubuntu-latest
    env:
      CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      DEEPL_API_HOST: ${{ vars.DEEPL_API_HOST }}

    steps:
      - name: Debounce Craft rebuild
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          CRAFT_REBUILD_DEBOUNCE_SECONDS: ${{ vars.CRAFT_REBUILD_DEBOUNCE_SECONDS }}
        run: sleep "${CRAFT_REBUILD_DEBOUNCE_SECONDS:-180}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore DeepL translation cache
        uses: actions/cache@v4
        with:
          path: .cache/deepl-translations.json
          key: deepl-translations-${{ github.run_id }}
          restore-keys: |
            deepl-translations-

      - name: Build
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-ovh:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_OVH_DEPLOY == 'true' }}

    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_TARGET_DIR: ${{ secrets.OVH_TARGET_DIR }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          rsync -az --delete --exclude "cms/" --exclude ".ovhconfig" dist/ "$OVH_USER@$OVH_HOST:$OVH_TARGET_DIR/"
