name: Rebuild from Craft

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - craft-content-saved

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: static-site-build-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Debounce Craft rebuild
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          CRAFT_REBUILD_DEBOUNCE_SECONDS: ${{ vars.CRAFT_REBUILD_DEBOUNCE_SECONDS }}
        run: sleep "${CRAFT_REBUILD_DEBOUNCE_SECONDS:-180}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: npm ci

      - name: Install form mailer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Validate PHP entry points
        run: |
          php -l src/api/guided-visits.php
          php -l cms/config/app.php
          php -l ops/prepare-craft-db-backup.php

      - name: Restore DeepL translation cache
        uses: actions/cache@v4
        with:
          path: .cache/deepl-translations.json
          key: deepl-translations-${{ github.run_id }}
          restore-keys: |
            deepl-translations-

      - name: Build
        env:
          CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
          CRAFT_REQUIRE_API: "true"
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: npm run build

      - name: Stamp build
        run: printf '%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/deploy-version.txt

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  deploy-ovh:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: static-site-deploy
      cancel-in-progress: false
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine deployment mode
        id: deployment
        run: |
          if test -f ops/deployment-enabled; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Deployment is enabled for this revision.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Preflight-only revision: remote backup will run, deployment will be skipped.'
          fi

      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -Eeuo pipefail
          : "${OVH_DEPLOY_KEY:?Missing OVH_DEPLOY_KEY}"
          : "${OVH_HOST:?Missing OVH_HOST}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Validate OVH paths and prepare rollback
        id: ovh
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_TARGET_DIR: ${{ secrets.OVH_TARGET_DIR }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${OVH_HOST:?Missing OVH_HOST}"
          : "${OVH_USER:?Missing OVH_USER}"
          : "${OVH_TARGET_DIR:?Missing OVH_TARGET_DIR}"

          [[ "$OVH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid OVH_HOST" >&2; exit 1; }
          [[ "$OVH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid OVH_USER" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" =~ ^(~/|/?)[A-Za-z0-9._/-]+$ ]] || { echo "Invalid OVH_TARGET_DIR" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" != "/" && "$OVH_TARGET_DIR" != "." && "$OVH_TARGET_DIR" != ".." ]] || { echo "Unsafe OVH_TARGET_DIR" >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" != *"//"* ]] || { echo "Unsafe OVH_TARGET_DIR" >&2; exit 1; }
          case "$OVH_TARGET_DIR" in
            ../*|*/../*|*/..|./*|*/./*|*/.) echo "Unsafe OVH_TARGET_DIR" >&2; exit 1 ;;
          esac

          SSH_TARGET="${OVH_USER}@${OVH_HOST}"
          REMOTE_HOME="$(ssh "$SSH_TARGET" 'cd && pwd -P')"
          [[ "$REMOTE_HOME" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Unexpected remote home" >&2; exit 1; }
          if [[ "$OVH_TARGET_DIR" == "~/"* ]]; then
            TARGET_FOR_CD="$REMOTE_HOME/${OVH_TARGET_DIR#\~/}"
          else
            TARGET_FOR_CD="$OVH_TARGET_DIR"
          fi
          REMOTE_TARGET="$(ssh "$SSH_TARGET" "cd -- '$TARGET_FOR_CD' && pwd -P")"
          REMOTE_CRAFT="$(ssh "$SSH_TARGET" 'cd "$HOME/craft" && pwd -P')"

          [[ "$REMOTE_TARGET" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Unexpected remote target" >&2; exit 1; }
          [[ "$REMOTE_CRAFT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Unexpected Craft root" >&2; exit 1; }
          [[ "$REMOTE_TARGET" != "$REMOTE_HOME" && "$REMOTE_TARGET" == "$REMOTE_HOME/"* ]] || { echo "Target must be a child of the remote home" >&2; exit 1; }
          [[ "$REMOTE_CRAFT" == "$REMOTE_HOME/craft" ]] || { echo "Unexpected Craft root" >&2; exit 1; }
          [[ "$REMOTE_TARGET" != "$REMOTE_CRAFT" && "$REMOTE_TARGET" != "$REMOTE_CRAFT/"* && "$REMOTE_CRAFT" != "$REMOTE_TARGET/"* ]] || { echo "Static and Craft roots overlap" >&2; exit 1; }

          ssh "$SSH_TARGET" \
            "test -d '$REMOTE_TARGET/cms' &&
             test -f '$REMOTE_TARGET/cms/index.php' &&
             test -f '$REMOTE_CRAFT/.env' &&
             test -f '$REMOTE_CRAFT/config/app.php' &&
             test -f '$REMOTE_CRAFT/craft' &&
             test -f '$REMOTE_CRAFT/vendor/autoload.php'"

          ssh "$SSH_TARGET" \
            "test -f '$REMOTE_TARGET/.val-dieu-deploy-root' &&
             grep -qxF 'val-dieu-static-root-v1' '$REMOTE_TARGET/.val-dieu-deploy-root' &&
             test -f '$REMOTE_CRAFT/.val-dieu-craft-root' &&
             grep -qxF 'val-dieu-craft-root-v1' '$REMOTE_CRAFT/.val-dieu-craft-root'"

          BACKUP_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_BACKUP="$REMOTE_HOME/.val-dieu-deploy-backups/$BACKUP_ID"
          ssh "$SSH_TARGET" \
            "set -eu
             umask 077
             mkdir -p '$REMOTE_BACKUP/static' '$REMOTE_BACKUP/craft-stage'
             chmod 700 '$REMOTE_BACKUP' '$REMOTE_BACKUP/static' '$REMOTE_BACKUP/craft-stage'
             find '$REMOTE_TARGET' -mindepth 1 \( -path '$REMOTE_TARGET/cms' -o -path '$REMOTE_TARGET/uploads' -o -path '$REMOTE_TARGET/.*' \) -prune -o -type f -printf '%P\n' | LC_ALL=C sort > '$REMOTE_BACKUP/static-manifest-before.txt'"

          printf 'remote_target=%s\n' "$REMOTE_TARGET" >> "$GITHUB_OUTPUT"
          printf 'remote_craft=%s\n' "$REMOTE_CRAFT" >> "$GITHUB_OUTPUT"
          printf 'remote_backup=%s\n' "$REMOTE_BACKUP" >> "$GITHUB_OUTPUT"

      - name: Back up Craft data and create stage
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_REMOTE_CRAFT: ${{ steps.ovh.outputs.remote_craft }}
          OVH_REMOTE_TARGET: ${{ steps.ovh.outputs.remote_target }}
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${OVH_USER}@${OVH_HOST}"
          rsync -az --chmod=F600 -- \
            ops/prepare-craft-db-backup.php \
            "$SSH_TARGET:$OVH_REMOTE_BACKUP/craft-stage/prepare-craft-db-backup.php"
          ssh "$SSH_TARGET" "bash -s -- '$OVH_REMOTE_CRAFT' '$OVH_REMOTE_TARGET' '$OVH_REMOTE_BACKUP'" <<'REMOTE'
          set -Eeuo pipefail
          CRAFT_DIR="$(cd "$1" && pwd -P)"
          TARGET_DIR="$(cd "$2" && pwd -P)"
          BACKUP_DIR="$(cd "$3" && pwd -P)"
          HOME_DIR="$(cd "$HOME" && pwd -P)"

          [[ "$CRAFT_DIR" == "$HOME_DIR/craft" ]]
          [[ "$TARGET_DIR" == "$HOME_DIR/"* && "$TARGET_DIR" != "$HOME_DIR" ]]
          [[ "$BACKUP_DIR" == "$HOME_DIR/.val-dieu-deploy-backups/"* ]]
          [[ "${BACKUP_DIR##*/}" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]]

          umask 077
          mkdir -p \
            "$BACKUP_DIR/craft" \
            "$BACKUP_DIR/craft-stage/config" \
            "$BACKUP_DIR/craft-stage/modules/githubdispatch/jobs"
          chmod 700 "$BACKUP_DIR" "$BACKUP_DIR/craft" "$BACKUP_DIR/craft-stage"
          backup_helper="$BACKUP_DIR/craft-stage/prepare-craft-db-backup.php"
          test -f "$backup_helper"
          test ! -L "$backup_helper"
          test -O "$backup_helper"
          [[ "$(stat -c '%a' "$backup_helper")" == '600' ]]
          php -l "$backup_helper" >/dev/null

          describe_cms_entry() {
            entry="$TARGET_DIR/cms"
            if [ -L "$entry" ]; then
              kind='symlink'
              link_target="$(readlink "$entry")"
            elif [ -d "$entry" ]; then
              kind='directory'
              link_target=''
            else
              echo 'The CMS entry point is missing.' >&2
              return 1
            fi
            real_target="$(cd "$entry" && pwd -P)"
            printf 'kind=%s\nlink=%s\nreal=%s\n' "$kind" "$link_target" "$real_target"
          }

          describe_cms_entry > "$BACKUP_DIR/craft/cms-entry-before.txt"
          cp -p "$CRAFT_DIR/.env" "$BACKUP_DIR/craft/craft.env"
          cp -p "$CRAFT_DIR/config/app.php" "$BACKUP_DIR/craft/app.php"

          if [ -L "$TARGET_DIR/.htaccess" ]; then
            echo 'Static .htaccess must not be a symlink.' >&2
            exit 1
          elif [ -f "$TARGET_DIR/.htaccess" ]; then
            install -m 0600 -- "$TARGET_DIR/.htaccess" "$BACKUP_DIR/craft/static-root.htaccess"
            if grep -Eq 'VALDIEU_(MAIL_CONFIG|SMTP_[A-Z_]+|FORM_TO_EMAIL)' "$TARGET_DIR/.htaccess"; then
              echo 'Mail preflight failed: the existing static .htaccess injects private mail settings.' >&2
              exit 1
            fi
          fi

          # The public reservation form falls back to the existing PHP mail()
          # behavior when this private file is absent. If it exists, validate
          # it without printing values and include it in the encrypted backup.
          mail_config="$HOME_DIR/.val-dieu-mail.php"
          if [ -L "$mail_config" ]; then
            echo 'Mail preflight failed: private configuration must not be a symlink.' >&2
            exit 1
          elif [ -e "$mail_config" ]; then
            test -f "$mail_config"
            test -r "$mail_config"
            mail_mode="$(
              php -d display_errors=0 -d log_errors=0 -r '
                  $fail = static function(): never {
                      fwrite(STDERR, "Private mail configuration validation failed.\n");
                      exit(1);
                  };
                  $bufferLevel = ob_get_level();
                  set_error_handler(static function(
                      int $severity,
                      string $message,
                      string $file,
                      int $line,
                  ): never {
                      throw new ErrorException("Configuration load failed.", 0, $severity, $file, $line);
                  });
                  ob_start();
                  try {
                      $path = $argv[1] ?? "";
                      if (!is_file($path) || is_link($path) || !is_readable($path)) {
                          $fail();
                        }
                      $permissions = fileperms($path);
                      if (!is_int($permissions) || (($permissions & 0077) !== 0)) {
                          $fail();
                      }
                      $values = require $path;
                      $unexpectedOutput = ob_get_clean();
                      restore_error_handler();
                      if ($unexpectedOutput !== "" || !is_array($values)) {
                          $fail();
                      }
                      $value = static function(string $key, string $default = "") use ($values, $fail): string {
                          if (!array_key_exists($key, $values) || $values[$key] === null) {
                              return $default;
                          }
                          if (!is_scalar($values[$key])) {
                              $fail();
                          }
                          $candidate = trim((string)$values[$key]);
                          if (str_contains($candidate, "\0") || str_contains($candidate, "\r") || str_contains($candidate, "\n")) {
                              $fail();
                          }
                          return $candidate;
                      };
                      $smtp = [
                          $value("VALDIEU_SMTP_HOST"),
                          $value("VALDIEU_SMTP_USERNAME"),
                          $value("VALDIEU_SMTP_PASSWORD"),
                      ];
                      $smtpCount = count(array_filter($smtp, static fn(string $item): bool => $item !== ""));
                      if ($smtpCount !== 0 && $smtpCount !== 3) {
                          $fail();
                      }
                      if ($smtpCount === 3) {
                          $placeholders = ["smtp.example.com", "smtp-user@example.com", "replace-with-a-secret"];
                          foreach ($smtp as $item) {
                              if (in_array(strtolower($item), $placeholders, true)) {
                                  $fail();
                              }
                          }
                          $port = $value("VALDIEU_SMTP_PORT", "587");
                          if (preg_match("~\A[0-9]{1,5}\z~D", $port) !== 1 || (int)$port < 1 || (int)$port > 65535) {
                              $fail();
                          }
                          $encryption = strtolower($value("VALDIEU_SMTP_ENCRYPTION", "tls"));
                          if (!in_array($encryption, ["tls", "smtps", "none"], true)) {
                              $fail();
                          }
                      }
                      $from = $value("VALDIEU_SMTP_FROM_EMAIL", "infotourist@val-dieu.net");
                      $value("VALDIEU_SMTP_FROM_NAME", "Val-Dieu");
                      $to = $value("VALDIEU_FORM_TO_EMAIL", "elann.fraiture@gmail.com");
                      if (!filter_var($from, FILTER_VALIDATE_EMAIL) || !filter_var($to, FILTER_VALIDATE_EMAIL)) {
                          $fail();
                      }
                      fwrite(STDOUT, $smtpCount === 3 ? "smtp\n" : "mail\n");
                  } catch (Throwable) {
                      while (ob_get_level() > $bufferLevel) {
                          ob_end_clean();
                      }
                      restore_error_handler();
                      $fail();
                    }
              ' -- "$mail_config"
            )"
            case "$mail_mode" in
              mail|smtp) ;;
              *) echo 'Unexpected private mail mode.' >&2; exit 1 ;;
            esac
            install -m 0600 -- "$mail_config" "$BACKUP_DIR/craft/mail-secrets.php"
            cmp -s -- "$mail_config" "$BACKUP_DIR/craft/mail-secrets.php"
            (
              cd "$BACKUP_DIR/craft"
              sha256sum mail-secrets.php > mail-secrets.sha256
            )
            printf 'private-%s\n' "$mail_mode" > "$BACKUP_DIR/craft/mail-mode.txt"
            echo "Mail preflight: private configuration validated; $mail_mode mode selected."
          else
            printf 'fallback-mail\n' > "$BACKUP_DIR/craft/mail-mode.txt"
            echo 'Mail preflight: no private configuration; legacy mail() fallback confirmed.'
          fi

          set -- .env config composer.json composer.lock modules
          for optional_path in storage/config-deltas web/index.php web/.htaccess; do
            if [ -e "$CRAFT_DIR/$optional_path" ]; then
              set -- "$@" "$optional_path"
            fi
          done
          tar -C "$CRAFT_DIR" -czf "$BACKUP_DIR/craft/craft-files.tar.gz" "$@"
          tar -tzf "$BACKUP_DIR/craft/craft-files.tar.gz" >/dev/null
          sha256sum "$BACKUP_DIR/craft/craft-files.tar.gz" > "$BACKUP_DIR/craft/craft-files.sha256"

          # Resolve uploads through the public CMS entry point: Craft's web root
          # is configurable and the uploads directory may itself be a symlink.
          test -d "$TARGET_DIR/cms/uploads"
          uploads_real="$(cd "$TARGET_DIR/cms/uploads" && pwd -P)"
          [[ "$uploads_real" == "$HOME_DIR/"* ]]
          printf '%s\n' "$uploads_real" > "$BACKUP_DIR/craft/uploads-real-path.txt"
          tar -C "$uploads_real" -czf "$BACKUP_DIR/craft/uploads.tar.gz" .
          tar -tzf "$BACKUP_DIR/craft/uploads.tar.gz" >/dev/null
          sha256sum "$BACKUP_DIR/craft/uploads.tar.gz" > "$BACKUP_DIR/craft/uploads.sha256"
          uploads_file_count="$(find "$uploads_real" -type f -printf '.' | wc -c | tr -d '[:space:]')"
          [[ "$uploads_file_count" =~ ^[0-9]+$ ]]
          (( uploads_file_count > 0 ))
          printf '%s\n' "$uploads_file_count" > "$BACKUP_DIR/craft/uploads-file-count.txt"

          if [ -d "$TARGET_DIR/uploads" ]; then
            root_uploads_real="$(cd "$TARGET_DIR/uploads" && pwd -P)"
            [[ "$root_uploads_real" == "$HOME_DIR/"* ]]
            if [ "$root_uploads_real" != "$uploads_real" ]; then
              tar -C "$root_uploads_real" -czf "$BACKUP_DIR/craft/root-uploads.tar.gz" .
              tar -tzf "$BACKUP_DIR/craft/root-uploads.tar.gz" >/dev/null
              sha256sum "$BACKUP_DIR/craft/root-uploads.tar.gz" > "$BACKUP_DIR/craft/root-uploads.sha256"
            fi
          fi

          # OVH terminates Craft's nested process wrapper, and its PHP runtime
          # caches sys_get_temp_dir() before CLI overrides are applied. Build
          # the same private client config at a deterministic path, then run
          # Craft's two canonical mysqldump phases directly in this SSH shell.
          dump_target="$BACKUP_DIR/craft/database.sql"
          dump_partial="$BACKUP_DIR/craft/database.sql.partial"
          dump_temp_dir="$BACKUP_DIR/craft-stage/database-tmp"
          test ! -e "$dump_target"
          test ! -L "$dump_target"
          test ! -e "$dump_partial"
          test ! -L "$dump_partial"
          test ! -L "$dump_temp_dir"
          install -d -m 700 "$dump_temp_dir"
          dump_temp_dir="$(cd "$dump_temp_dir" && pwd -P)"
          [[ "$dump_temp_dir" == "$BACKUP_DIR/craft-stage/database-tmp" ]]
          test -O "$dump_temp_dir"
          [[ "$(stat -c '%a' "$dump_temp_dir")" == '700' ]]

          dump_cnf="$dump_temp_dir/database.cnf"
          dump_database_file="$dump_temp_dir/database-name.txt"
          dump_charset_file="$dump_temp_dir/database-charset.txt"
          dump_single_transaction_file="$dump_temp_dir/single-transaction.txt"
          dump_ignored_tables_file="$dump_temp_dir/ignored-tables.nul"
          export VALDIEU_DB_BACKUP_CNF="$dump_cnf"
          export VALDIEU_DB_BACKUP_DATABASE_FILE="$dump_database_file"
          export VALDIEU_DB_BACKUP_CHARSET_FILE="$dump_charset_file"
          export VALDIEU_DB_BACKUP_SINGLE_TRANSACTION_FILE="$dump_single_transaction_file"
          export VALDIEU_DB_BACKUP_IGNORED_TABLES_FILE="$dump_ignored_tables_file"
          export VALDIEU_DB_BACKUP_TEMP_DIR="$dump_temp_dir"
          dump_complete='false'
          dump_cleanup() {
            prior_status=$?
            trap - EXIT
            set +e
            cleanup_failed=0
            if [ "$dump_complete" != 'true' ]; then
              rm -f -- "$dump_target" "$dump_partial" || cleanup_failed=1
            fi
            if [ -d "$dump_temp_dir" ]; then
              find "$dump_temp_dir" -mindepth 1 -delete || cleanup_failed=1
              rmdir -- "$dump_temp_dir" || cleanup_failed=1
            fi
            set -e
            if [ "$cleanup_failed" -ne 0 ]; then
              echo 'Private database backup cleanup failed.' >&2
              return 1
            fi
            return "$prior_status"
          }
          trap dump_cleanup EXIT

          cd "$CRAFT_DIR"
          export VALDIEU_DB_BACKUP_HELPER="$backup_helper"
          php craft exec/exec 'require getenv("VALDIEU_DB_BACKUP_HELPER")' \
            --interactive=0 --color=0 >/dev/null

          for private_file in \
            "$dump_cnf" \
            "$dump_database_file" \
            "$dump_charset_file" \
            "$dump_single_transaction_file" \
            "$dump_ignored_tables_file"
          do
            test -f "$private_file"
            test ! -L "$private_file"
            test -O "$private_file"
            [[ "$(stat -c '%a' "$private_file")" == '600' ]]
          done

          IFS= read -r dump_database < "$dump_database_file"
          IFS= read -r dump_charset < "$dump_charset_file"
          IFS= read -r dump_single_transaction < "$dump_single_transaction_file"
          [[ "$dump_database" =~ ^[A-Za-z0-9_]+$ ]]
          [[ "$dump_charset" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$dump_single_transaction" == '0' || "$dump_single_transaction" == '1' ]]

          ignore_args=()
          while IFS= read -r -d '' ignored_table; do
            [[ "$ignored_table" =~ ^[A-Za-z0-9_]+$ ]]
            ignore_args+=("--ignore-table=$dump_database.$ignored_table")
          done < "$dump_ignored_tables_file"
          (( ${#ignore_args[@]} > 0 ))

          command -v mysqldump >/dev/null
          dump_client_home="$dump_temp_dir/client-home"
          install -d -m 700 "$dump_client_home"
          dump_client_home="$(cd "$dump_client_home" && pwd -P)"
          test -O "$dump_client_home"
          [[ "$(stat -c '%a' "$dump_client_home")" == '700' ]]
          export HOME="$dump_client_home"
          unset MYSQL_TEST_LOGIN_FILE MYSQL_HOME MYSQL_GROUP_SUFFIX
          unset MYSQL_PWD MYSQL_HOST MYSQL_TCP_PORT MYSQL_UNIX_PORT
          dump_help="$dump_temp_dir/mysqldump-help.txt"
          LC_ALL=C mysqldump --no-defaults --help > "$dump_help" 2>/dev/null
          dump_args=(
            "--defaults-file=$dump_cnf"
            --add-drop-table
            --comments
            --create-options
            --dump-date
            --no-autocommit
            "--default-character-set=$dump_charset"
            --set-charset
            --triggers
            --no-tablespaces
          )
          if [ "$dump_single_transaction" == '1' ]; then
            dump_args+=(--single-transaction)
          fi
          if grep -F -- 'column-statistics' "$dump_help" >/dev/null; then
            dump_args+=(--column-statistics=0)
          fi

          mysqldump "${dump_args[@]}" \
            --skip-events \
            --skip-routines \
            --no-data \
            --skip-triggers \
            "--result-file=$dump_partial" \
            "$dump_database"
          mysqldump "${dump_args[@]}" \
            --events \
            --routines \
            --no-create-info \
            "${ignore_args[@]}" \
            "$dump_database" >> "$dump_partial"
          test -f "$dump_partial"
          test ! -L "$dump_partial"
          test -O "$dump_partial"
          [[ "$(stat -c '%a' "$dump_partial")" == '600' ]]
          test -s "$dump_partial"
          grep -m1 -E '^CREATE TABLE ' "$dump_partial" >/dev/null
          grep -m1 -E '^INSERT INTO ' "$dump_partial" >/dev/null
          mv -- "$dump_partial" "$dump_target"
          dump_complete='true'
          dump_cleanup
          export HOME="$HOME_DIR"
          unset VALDIEU_DB_BACKUP_CNF VALDIEU_DB_BACKUP_DATABASE_FILE VALDIEU_DB_BACKUP_CHARSET_FILE
          unset VALDIEU_DB_BACKUP_SINGLE_TRANSACTION_FILE VALDIEU_DB_BACKUP_IGNORED_TABLES_FILE
          unset VALDIEU_DB_BACKUP_TEMP_DIR VALDIEU_DB_BACKUP_HELPER

          test -s "$BACKUP_DIR/craft/database.sql"
          gzip -9 "$BACKUP_DIR/craft/database.sql"
          gzip -t "$BACKUP_DIR/craft/database.sql.gz"
          zgrep -m1 -E '^CREATE TABLE ' "$BACKUP_DIR/craft/database.sql.gz" >/dev/null
          zgrep -m1 -E '^INSERT INTO ' "$BACKUP_DIR/craft/database.sql.gz" >/dev/null
          sha256sum "$BACKUP_DIR/craft/database.sql.gz" > "$BACKUP_DIR/craft/database.sha256"

          if [ -L "$CRAFT_DIR/modules/githubdispatch-current" ]; then
            readlink "$CRAFT_DIR/modules/githubdispatch-current" > "$BACKUP_DIR/craft/githubdispatch.previous-link"
          elif [ -e "$CRAFT_DIR/modules/githubdispatch-current" ]; then
            echo 'Unexpected non-symlink Craft module path' >&2
            exit 1
          fi

          test -s "$BACKUP_DIR/craft/database.sql.gz"
          test -s "$BACKUP_DIR/craft/uploads.tar.gz"
          test -s "$BACKUP_DIR/craft/craft-files.tar.gz"
          echo 'Craft database, uploads, environment and configuration backup verified.'
          REMOTE

      - name: Create encrypted offsite preflight backup
        if: ${{ steps.deployment.outputs.enabled != 'true' }}
        id: offsite
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          umask 077
          BACKUP_ID="${OVH_REMOTE_BACKUP##*/}"
          [[ "$BACKUP_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]]
          OFFSITE_DIR="$RUNNER_TEMP/val-dieu-offsite-$BACKUP_ID"
          PLAINTEXT_ARCHIVE="$RUNNER_TEMP/val-dieu-$BACKUP_ID.tar.gz"
          ENCRYPTED_ARCHIVE="$RUNNER_TEMP/val-dieu-$BACKUP_ID.tar.gz.cms"
          trap 'rm -rf -- "$OFFSITE_DIR" "$PLAINTEXT_ARCHIVE"' EXIT

          install -d -m 700 "$OFFSITE_DIR/craft"
          rsync -az -- \
            "$OVH_USER@$OVH_HOST:$OVH_REMOTE_BACKUP/craft/" \
            "$OFFSITE_DIR/craft/"

          test -s "$OFFSITE_DIR/craft/database.sql.gz"
          test -s "$OFFSITE_DIR/craft/uploads.tar.gz"
          test -s "$OFFSITE_DIR/craft/craft-files.tar.gz"
          test -s "$OFFSITE_DIR/craft/mail-mode.txt"
          gzip -t "$OFFSITE_DIR/craft/database.sql.gz"
          tar -tzf "$OFFSITE_DIR/craft/uploads.tar.gz" >/dev/null
          tar -tzf "$OFFSITE_DIR/craft/craft-files.tar.gz" >/dev/null
          for item in database.sql.gz uploads.tar.gz craft-files.tar.gz; do
            case "$item" in
              database.sql.gz) checksum_file='database.sha256' ;;
              uploads.tar.gz) checksum_file='uploads.sha256' ;;
              craft-files.tar.gz) checksum_file='craft-files.sha256' ;;
            esac
            expected="$(awk 'NR == 1 { print $1 }' "$OFFSITE_DIR/craft/$checksum_file")"
            actual="$(sha256sum "$OFFSITE_DIR/craft/$item" | awk '{ print $1 }')"
            [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          done

          IFS= read -r mail_mode < "$OFFSITE_DIR/craft/mail-mode.txt"
          case "$mail_mode" in
            fallback-mail)
              test ! -e "$OFFSITE_DIR/craft/mail-secrets.php"
              test ! -e "$OFFSITE_DIR/craft/mail-secrets.sha256"
              ;;
            private-mail|private-smtp)
              test -f "$OFFSITE_DIR/craft/mail-secrets.php"
              test ! -L "$OFFSITE_DIR/craft/mail-secrets.php"
              test -s "$OFFSITE_DIR/craft/mail-secrets.sha256"
              expected="$(awk 'NR == 1 { print $1 }' "$OFFSITE_DIR/craft/mail-secrets.sha256")"
              actual="$(sha256sum "$OFFSITE_DIR/craft/mail-secrets.php" | awk '{ print $1 }')"
              [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
              ;;
            *)
              echo 'Unexpected backed-up mail mode.' >&2
              exit 1
              ;;
          esac

          if [ -e "$OFFSITE_DIR/craft/root-uploads.tar.gz" ] || [ -e "$OFFSITE_DIR/craft/root-uploads.sha256" ]; then
            test -s "$OFFSITE_DIR/craft/root-uploads.tar.gz"
            test -s "$OFFSITE_DIR/craft/root-uploads.sha256"
            tar -tzf "$OFFSITE_DIR/craft/root-uploads.tar.gz" >/dev/null
            expected="$(awk 'NR == 1 { print $1 }' "$OFFSITE_DIR/craft/root-uploads.sha256")"
            actual="$(sha256sum "$OFFSITE_DIR/craft/root-uploads.tar.gz" | awk '{ print $1 }')"
            [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          fi

          tar -C "$OFFSITE_DIR" -czf "$PLAINTEXT_ARCHIVE" craft
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$PLAINTEXT_ARCHIVE" \
            -out "$ENCRYPTED_ARCHIVE" \
            ops/offsite-backup-cert.pem
          test -s "$ENCRYPTED_ARCHIVE"
          sha256sum "$ENCRYPTED_ARCHIVE"
          printf 'artifact_name=encrypted-recovery-%s\n' "$BACKUP_ID" >> "$GITHUB_OUTPUT"
          printf 'encrypted_path=%s\n' "$ENCRYPTED_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted offsite preflight backup
        if: ${{ steps.deployment.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.offsite.outputs.artifact_name }}
          path: ${{ steps.offsite.outputs.encrypted_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Deploy versioned Craft rebuild integration
        if: ${{ steps.deployment.outputs.enabled == 'true' }}
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_REMOTE_CRAFT: ${{ steps.ovh.outputs.remote_craft }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${OVH_USER}@${OVH_HOST}"
          STAGE="$OVH_REMOTE_BACKUP/craft-stage"

          rsync -az cms/config/app.php "$SSH_TARGET:$STAGE/config/"
          rsync -az cms/modules/githubdispatch/ "$SSH_TARGET:$STAGE/modules/githubdispatch/"

          ssh "$SSH_TARGET" "bash -s -- '$OVH_REMOTE_CRAFT' '$OVH_REMOTE_BACKUP' '$RELEASE_ID' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          set -Eeuo pipefail
          CRAFT_DIR="$1"
          BACKUP_DIR="$2"
          RELEASE_ID="$3"
          RUN_ID="$4"
          STAGE="$BACKUP_DIR/craft-stage"
          RELEASES="$CRAFT_DIR/modules/githubdispatch-releases"
          RELEASE="$RELEASES/$RELEASE_ID"
          TEMP_RELEASE="$RELEASES/.release-$RUN_ID"
          LIVE="$CRAFT_DIR/modules/githubdispatch-current"
          OLD_KIND="absent"
          OLD_TARGET=""

          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]

          php -l "$STAGE/config/app.php"
          php -l "$STAGE/modules/githubdispatch/Module.php"
          php -l "$STAGE/modules/githubdispatch/jobs/DispatchRepository.php"

          mkdir -p "$RELEASES"
          if [ ! -d "$RELEASE" ]; then
            test ! -e "$TEMP_RELEASE"
            mkdir -p "$TEMP_RELEASE/jobs"
            install -m 0644 "$STAGE/modules/githubdispatch/jobs/DispatchRepository.php" "$TEMP_RELEASE/jobs/DispatchRepository.php"
            install -m 0644 "$STAGE/modules/githubdispatch/Module.php" "$TEMP_RELEASE/Module.php"
            mv "$TEMP_RELEASE" "$RELEASE"
          else
            cmp -s "$STAGE/modules/githubdispatch/jobs/DispatchRepository.php" "$RELEASE/jobs/DispatchRepository.php"
            cmp -s "$STAGE/modules/githubdispatch/Module.php" "$RELEASE/Module.php"
          fi

          if [ -L "$LIVE" ]; then
            OLD_KIND="symlink"
            OLD_TARGET="$(readlink "$LIVE")"
          elif [ -e "$LIVE" ]; then
            echo "Unexpected non-symlink Craft module path" >&2
            exit 1
          fi

          rollback() {
            status=$?
            trap - ERR
            set +e
            install -m 0644 "$BACKUP_DIR/craft/app.php" "$CRAFT_DIR/config/app.php.rollback-$RUN_ID"
            mv -f "$CRAFT_DIR/config/app.php.rollback-$RUN_ID" "$CRAFT_DIR/config/app.php"
            if [ "$OLD_KIND" = "symlink" ]; then
              ln -s "$OLD_TARGET" "$LIVE.rollback-$RUN_ID"
              mv -Tf "$LIVE.rollback-$RUN_ID" "$LIVE"
            elif [ -L "$LIVE" ]; then
              mv "$LIVE" "$BACKUP_DIR/craft/githubdispatch.failed-link"
            fi
            echo "Craft integration failed; module link and app.php were rolled back." >&2
            exit "$status"
          }
          trap rollback ERR

          ln -s "githubdispatch-releases/$RELEASE_ID" "$LIVE.next-$RUN_ID"
          mv -Tf "$LIVE.next-$RUN_ID" "$LIVE"
          install -m 0644 "$STAGE/config/app.php" "$CRAFT_DIR/config/app.php.next"
          mv "$CRAFT_DIR/config/app.php.next" "$CRAFT_DIR/config/app.php"

          cd "$CRAFT_DIR"
          php craft help --interactive=0 --color=0 >/dev/null
          php craft exec/exec '(function (): bool { $token = \craft\helpers\App::env("GITHUB_DISPATCH_TOKEN"); $repository = \craft\helpers\App::env("GITHUB_DISPATCH_REPOSITORY") ?: "crokstudio/val-dieu"; if (!is_string($token) || trim($token) === "") { throw new RuntimeException("GITHUB_DISPATCH_TOKEN is missing"); } if (!is_string($repository) || !preg_match("~^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$~", $repository)) { throw new RuntimeException("GITHUB_DISPATCH_REPOSITORY is invalid"); } if (Craft::$app->getModule("github-dispatch") === null) { throw new RuntimeException("github-dispatch module is unavailable"); } return true; })()' --interactive=0 --color=0
          trap - ERR
          REMOTE

      - name: Verify Craft web and roll back on failure
        if: ${{ steps.deployment.outputs.enabled == 'true' }}
        env:
          CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_REMOTE_CRAFT: ${{ steps.ovh.outputs.remote_craft }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${CRAFT_API_URL:?Missing CRAFT_API_URL}"
          CRAFT_URL_PATTERN='^https?://[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9._~%/?&=+-]+$'
          [[ "$CRAFT_API_URL" =~ $CRAFT_URL_PATTERN ]] || { echo 'Invalid Craft API URL' >&2; exit 1; }

          SEPARATOR='?'
          case "$CRAFT_API_URL" in *\?*) SEPARATOR='&' ;; esac
          if curl --proto '=http,https' --proto-redir '=http,https' \
            --fail --location --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "${CRAFT_API_URL}${SEPARATOR}deploy_health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          then
            echo 'Craft web bootstrap is healthy.'
            exit 0
          fi

          ssh "$OVH_USER@$OVH_HOST" "bash -s -- '$OVH_REMOTE_CRAFT' '$OVH_REMOTE_BACKUP' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          set -Eeuo pipefail
          CRAFT_DIR="$(cd "$1" && pwd -P)"
          BACKUP_DIR="$(cd "$2" && pwd -P)"
          RUN_ID="$3"
          HOME_DIR="$(cd "$HOME" && pwd -P)"
          LIVE="$CRAFT_DIR/modules/githubdispatch-current"
          RELEASES_REAL="$(cd "$CRAFT_DIR/modules/githubdispatch-releases" && pwd -P)"
          PREVIOUS_LINK="$BACKUP_DIR/craft/githubdispatch.previous-link"

          [[ "$RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$CRAFT_DIR" == "$HOME_DIR/craft" ]]
          [[ "$BACKUP_DIR" == "$HOME_DIR/.val-dieu-deploy-backups/"* ]]
          [[ "${BACKUP_DIR##*/}" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]]
          grep -qxF 'val-dieu-craft-root-v1' "$CRAFT_DIR/.val-dieu-craft-root"
          test -f "$BACKUP_DIR/craft/app.php"
          php -l "$BACKUP_DIR/craft/app.php" >/dev/null

          RESTORE_TARGET=''
          if [ -f "$PREVIOUS_LINK" ]; then
            IFS= read -r OLD_TARGET < "$PREVIOUS_LINK"
            test -n "$OLD_TARGET"
            case "$OLD_TARGET" in
              /*) OLD_PATH="$OLD_TARGET" ;;
              *) OLD_PATH="$CRAFT_DIR/modules/$OLD_TARGET" ;;
            esac
            OLD_REAL="$(cd "$OLD_PATH" && pwd -P)"
            [[ "$OLD_REAL" == "$RELEASES_REAL/"* ]]
            OLD_RELEASE="${OLD_REAL#"$RELEASES_REAL/"}"
            [[ "$OLD_RELEASE" =~ ^[0-9a-f]{40}$ ]]
            RESTORE_TARGET="githubdispatch-releases/$OLD_RELEASE"
          fi

          install -m 0644 "$BACKUP_DIR/craft/app.php" "$CRAFT_DIR/config/app.php.rollback-$RUN_ID"
          mv -f "$CRAFT_DIR/config/app.php.rollback-$RUN_ID" "$CRAFT_DIR/config/app.php"
          if [ -n "$RESTORE_TARGET" ]; then
            ln -s "$RESTORE_TARGET" "$LIVE.rollback-$RUN_ID"
            mv -Tf "$LIVE.rollback-$RUN_ID" "$LIVE"
          elif [ -L "$LIVE" ]; then
            mv "$LIVE" "$BACKUP_DIR/craft/githubdispatch.failed-link-$RUN_ID"
          fi

          cd "$CRAFT_DIR"
          php craft help --interactive=0 --color=0 >/dev/null
          REMOTE

          echo 'Craft web verification failed; the previous integration was restored.' >&2
          exit 1

      - name: Configure Craft production site URL
        if: ${{ steps.deployment.outputs.enabled == 'true' && vars.CRAFT_PRIMARY_SITE_URL != '' }}
        env:
          CRAFT_PRIMARY_SITE_URL: ${{ vars.CRAFT_PRIMARY_SITE_URL }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_REMOTE_CRAFT: ${{ steps.ovh.outputs.remote_craft }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${OVH_HOST:?Missing OVH_HOST}"
          : "${OVH_USER:?Missing OVH_USER}"
          : "${OVH_REMOTE_BACKUP:?Missing OVH_REMOTE_BACKUP}"
          : "${OVH_REMOTE_CRAFT:?Missing OVH_REMOTE_CRAFT}"

          EXPECTED_SITE_URL='https://www.abbaye-du-val-dieu.be/cms'
          [[ "$CRAFT_PRIMARY_SITE_URL" == "$EXPECTED_SITE_URL" ]] || {
            echo 'CRAFT_PRIMARY_SITE_URL is not the approved production URL.' >&2
            exit 1
          }

          ssh "$OVH_USER@$OVH_HOST" \
            "bash -s -- '$OVH_REMOTE_CRAFT' '$OVH_REMOTE_BACKUP' '$CRAFT_PRIMARY_SITE_URL' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          set -Eeuo pipefail
          CRAFT_DIR="$(cd "$1" && pwd -P)"
          BACKUP_DIR="$(cd "$2" && pwd -P)"
          SITE_URL="$3"
          RUN_ID="$4"
          HOME_DIR="$(cd "$HOME" && pwd -P)"
          ENV_FILE="$CRAFT_DIR/.env"
          BACKUP_ENV="$BACKUP_DIR/craft/craft.env"
          NEXT_ENV="$CRAFT_DIR/.env.next-$RUN_ID"
          RESTORE_ENV="$CRAFT_DIR/.env.restore-$RUN_ID"
          UPDATED='false'

          [[ "$CRAFT_DIR" == "$HOME_DIR/craft" ]]
          [[ "$BACKUP_DIR" == "$HOME_DIR/.val-dieu-deploy-backups/"* ]]
          [[ "${BACKUP_DIR##*/}" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$SITE_URL" == 'https://www.abbaye-du-val-dieu.be/cms' ]]
          test -f "$ENV_FILE"
          test ! -L "$ENV_FILE"
          test -O "$ENV_FILE"
          test -f "$BACKUP_ENV"
          test ! -L "$BACKUP_ENV"
          test -O "$BACKUP_ENV"
          test ! -e "$NEXT_ENV"
          test ! -e "$RESTORE_ENV"
          [[ "$(grep -c '^PRIMARY_SITE_URL=' "$ENV_FILE" || true)" == '1' ]]
          cmp -s -- "$BACKUP_ENV" "$ENV_FILE"

          rollback_env() {
            status=$?
            trap - ERR
            set +e
            rm -f -- "$NEXT_ENV"
            if [ "$UPDATED" = 'true' ]; then
              if cp -p -- "$BACKUP_ENV" "$RESTORE_ENV" &&
                 mv -f -- "$RESTORE_ENV" "$ENV_FILE" &&
                 cmp -s -- "$BACKUP_ENV" "$ENV_FILE"
              then
                echo 'Craft site URL validation failed; the backed-up environment was restored.' >&2
              else
                echo "Craft site URL rollback failed; manual recovery from $BACKUP_ENV is required." >&2
              fi
            fi
            exit "$status"
          }
          trap rollback_env ERR

          umask 077
          awk -v site_url="$SITE_URL" '
            /^PRIMARY_SITE_URL=/ {
              print "PRIMARY_SITE_URL=" site_url
              next
            }
            { print }
          ' "$ENV_FILE" > "$NEXT_ENV"
          chmod --reference="$ENV_FILE" "$NEXT_ENV"
          [[ "$(grep -c '^PRIMARY_SITE_URL=' "$NEXT_ENV" || true)" == '1' ]]
          grep -qxF "PRIMARY_SITE_URL=$SITE_URL" "$NEXT_ENV"
          mv -- "$NEXT_ENV" "$ENV_FILE"
          UPDATED='true'

          cd "$CRAFT_DIR"
          php craft exec/exec '(function (): bool { $siteUrl = \craft\helpers\App::env("PRIMARY_SITE_URL"); if ($siteUrl !== "https://www.abbaye-du-val-dieu.be/cms") { throw new RuntimeException("PRIMARY_SITE_URL verification failed"); } return true; })()' --interactive=0 --color=0

          trap - ERR
          REMOTE

          if ! curl --proto '=https' --fail --location --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$CRAFT_PRIMARY_SITE_URL/api/homepage.json?deploy_health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          then
            if ssh "$OVH_USER@$OVH_HOST" \
              "bash -s -- '$OVH_REMOTE_CRAFT' '$OVH_REMOTE_BACKUP' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
            set -Eeuo pipefail
            CRAFT_DIR="$(cd "$1" && pwd -P)"
            BACKUP_DIR="$(cd "$2" && pwd -P)"
            RUN_ID="$3"
            HOME_DIR="$(cd "$HOME" && pwd -P)"
            ENV_FILE="$CRAFT_DIR/.env"
            BACKUP_ENV="$BACKUP_DIR/craft/craft.env"
            RESTORE_ENV="$CRAFT_DIR/.env.restore-public-$RUN_ID"

            [[ "$CRAFT_DIR" == "$HOME_DIR/craft" ]]
            [[ "$BACKUP_DIR" == "$HOME_DIR/.val-dieu-deploy-backups/"* ]]
            [[ "${BACKUP_DIR##*/}" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]]
            [[ "$RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
            test -f "$ENV_FILE"
            test ! -L "$ENV_FILE"
            test -O "$ENV_FILE"
            test -f "$BACKUP_ENV"
            test ! -L "$BACKUP_ENV"
            test -O "$BACKUP_ENV"
            test ! -e "$RESTORE_ENV"

            cp -p -- "$BACKUP_ENV" "$RESTORE_ENV"
            mv -f -- "$RESTORE_ENV" "$ENV_FILE"
            cmp -s -- "$BACKUP_ENV" "$ENV_FILE"
            cd "$CRAFT_DIR"
            php craft help --interactive=0 --color=0 >/dev/null
          REMOTE
            then
              echo 'Public Craft URL validation failed; the backed-up environment was restored.' >&2
            else
              echo 'Public Craft URL validation and automatic rollback both failed; manual recovery is required.' >&2
            fi
            exit 1
          fi

          echo 'Craft PRIMARY_SITE_URL now uses the approved production URL.'

      - name: Deploy to OVH
        if: ${{ steps.deployment.outputs.enabled == 'true' }}
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_REMOTE_BACKUP: ${{ steps.ovh.outputs.remote_backup }}
          OVH_REMOTE_TARGET: ${{ steps.ovh.outputs.remote_target }}
        run: |
          set -Eeuo pipefail
          rsync -az \
            --delete-delay \
            --delay-updates \
            --backup \
            --backup-dir="$OVH_REMOTE_BACKUP/static" \
            --exclude='/cms' \
            --exclude='/uploads' \
            --include='/.htaccess' \
            --exclude='/.*' \
            --itemize-changes \
            dist/ "$OVH_USER@$OVH_HOST:$OVH_REMOTE_TARGET/"

          ssh "$OVH_USER@$OVH_HOST" "bash -s -- '$OVH_REMOTE_TARGET' '$OVH_REMOTE_BACKUP'" <<'REMOTE'
          set -Eeuo pipefail
          TARGET_DIR="$(cd "$1" && pwd -P)"
          BACKUP_DIR="$(cd "$2" && pwd -P)"
          HOME_DIR="$(cd "$HOME" && pwd -P)"
          [[ "$TARGET_DIR" == "$HOME_DIR/"* && "$TARGET_DIR" != "$HOME_DIR" ]]
          [[ "$BACKUP_DIR" == "$HOME_DIR/.val-dieu-deploy-backups/"* ]]

          describe_cms_entry() {
            entry="$TARGET_DIR/cms"
            if [ -L "$entry" ]; then
              kind='symlink'
              link_target="$(readlink "$entry")"
            elif [ -d "$entry" ]; then
              kind='directory'
              link_target=''
            else
              echo 'The CMS entry point disappeared during deployment.' >&2
              return 1
            fi
            real_target="$(cd "$entry" && pwd -P)"
            printf 'kind=%s\nlink=%s\nreal=%s\n' "$kind" "$link_target" "$real_target"
          }

          describe_cms_entry > "$BACKUP_DIR/craft/cms-entry-after.txt"
          cmp -s "$BACKUP_DIR/craft/cms-entry-before.txt" "$BACKUP_DIR/craft/cms-entry-after.txt"
          test -d "$TARGET_DIR/cms/uploads"
          uploads_real_after="$(cd "$TARGET_DIR/cms/uploads" && pwd -P)"
          printf '%s\n' "$uploads_real_after" > "$BACKUP_DIR/craft/uploads-real-path-after.txt"
          cmp -s "$BACKUP_DIR/craft/uploads-real-path.txt" "$BACKUP_DIR/craft/uploads-real-path-after.txt"
          uploads_file_count_after="$(find "$uploads_real_after" -type f -printf '.' | wc -c | tr -d '[:space:]')"
          [[ "$uploads_file_count_after" =~ ^[0-9]+$ ]]
          (( uploads_file_count_after > 0 ))
          test -s "$BACKUP_DIR/craft/database.sql.gz"
          gzip -t "$BACKUP_DIR/craft/database.sql.gz"
          find "$TARGET_DIR" -mindepth 1 \( -path "$TARGET_DIR/cms" -o -path "$TARGET_DIR/uploads" -o -path "$TARGET_DIR/.*" \) -prune -o -type f -printf '%P\n' | LC_ALL=C sort > "$BACKUP_DIR/static-manifest-after.txt"
          echo 'CMS entry point and verified Craft backup are intact after rsync.'
          REMOTE

      - name: Verify deployed revision over SSH
        if: ${{ steps.deployment.outputs.enabled == 'true' }}
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_REMOTE_TARGET: ${{ steps.ovh.outputs.remote_target }}
        run: |
          set -Eeuo pipefail
          EXPECTED="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ACTUAL="$(ssh "$OVH_USER@$OVH_HOST" "cat -- '$OVH_REMOTE_TARGET/deploy-version.txt'")"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Deployed OVH revision mismatch" >&2; exit 1; }

      - name: Verify public OVH revision
        if: ${{ steps.deployment.outputs.enabled == 'true' && vars.OVH_SITE_URL != '' }}
        env:
          OVH_SITE_URL: ${{ vars.OVH_SITE_URL }}
        run: |
          set -Eeuo pipefail
          [[ "$OVH_SITE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "OVH_SITE_URL must use HTTPS" >&2; exit 1; }
          EXPECTED="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ACTUAL="$(curl --fail --location --silent --show-error --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors "${OVH_SITE_URL%/}/deploy-version.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Deployed revision mismatch" >&2; exit 1; }

      - name: Report unavailable public health check
        if: ${{ steps.deployment.outputs.enabled == 'true' && vars.OVH_SITE_URL == '' }}
        run: echo "::warning::OVH_SITE_URL is not configured; public OVH revision verification was skipped."

      - name: Report preflight-only completion
        if: ${{ steps.deployment.outputs.enabled != 'true' }}
        run: echo 'Preflight backup completed and verified; no production files were deployed.'

      - name: Retain the ten latest recovery backups
        if: ${{ steps.deployment.outputs.enabled == 'true' }}
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          ssh "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BACKUP_ROOT="$HOME/.val-dieu-deploy-backups"
          test -d "$BACKUP_ROOT"
          kept=0
          while IFS= read -r name; do
            [[ "$name" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]] || continue
            kept=$((kept + 1))
            if [ "$kept" -gt 10 ]; then
              rm -rf -- "$BACKUP_ROOT/$name"
            fi
          done < <(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort -r)
          REMOTE
