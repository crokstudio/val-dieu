name: Inspect Craft emergency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: static-site-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -Eeuo pipefail
          : "${OVH_DEPLOY_KEY:?Missing OVH_DEPLOY_KEY}"
          : "${OVH_HOST:?Missing OVH_HOST}"
          [[ "$OVH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid OVH host' >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect Craft without exporting logs
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${OVH_HOST:?Missing OVH_HOST}"
          : "${OVH_USER:?Missing OVH_USER}"
          [[ "$OVH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid OVH host' >&2; exit 1; }
          [[ "$OVH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid OVH user' >&2; exit 1; }

          ssh "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CRAFT_DIR="$(cd "$HOME/craft" && pwd -P)"
          grep -qxF 'val-dieu-craft-root-v1' "$CRAFT_DIR/.val-dieu-craft-root"

          latest="$(find "$CRAFT_DIR/storage/logs" -maxdepth 1 -type f \( -name 'web.log' -o -name 'web-*.log' \) -printf '%T@ %p\n' | LC_ALL=C sort -n | tail -n 1)"
          LOG_FILE="${latest#* }"
          test -n "$LOG_FILE"
          test -f "$LOG_FILE"
          DIAG_FILE="$(mktemp)"
          trap 'rm -f "$DIAG_FILE"' EXIT
          tail -n 1600 "$LOG_FILE" > "$DIAG_FILE"

          if grep -qF 'Invalid path alias: @modules/githubdispatch/controllers' "$DIAG_FILE"; then
            echo 'diagnosis=stale_app_without_namespace_alias'
          elif grep -qF 'The GitHub dispatch release link is invalid.' "$DIAG_FILE"; then
            echo 'diagnosis=release_link_validation_failed'
          elif grep -qF 'Failed opening required' "$DIAG_FILE"; then
            echo 'diagnosis=required_module_file_unavailable'
          elif grep -qF 'modules\\githubdispatch\\Module' "$DIAG_FILE"; then
            echo 'diagnosis=github_dispatch_module_error'
          else
            echo 'diagnosis=unknown'
          fi

          ERROR_LINE="$({ grep -Ei '\[(web\.)?(ERROR|CRITICAL)\]' "$DIAG_FILE" || true; } \
            | tail -n 1 \
            | sed -E \
                -e 's#(Authorization: Bearer )[A-Za-z0-9._~-]+#\1[REDACTED]#g' \
                -e 's#(github_pat_|gh[pousr]_)[A-Za-z0-9_]+#[REDACTED]#g' \
                -e 's#([A-Za-z0-9_]*(TOKEN|PASSWORD|SECRET|API_KEY)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1[REDACTED]#Ig' \
            | LC_ALL=C cut -c1-400)"
          test -n "$ERROR_LINE"
          PUBLIC_KEY_FILE="$(mktemp)"
          trap 'rm -f "$DIAG_FILE" "$PUBLIC_KEY_FILE"' EXIT
          printf '%s' '' \
            | base64 -d > "$PUBLIC_KEY_FILE"
          ENCRYPTED_ERROR="$(printf '%s' "$ERROR_LINE" \
            | openssl pkeyutl -encrypt -pubin -keyform DER -inkey "$PUBLIC_KEY_FILE" \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 | tr -d '\n')"
          printf 'encrypted_error=%s\n' "$ENCRYPTED_ERROR"

          CURRENT_LINK='absent'
          if [ -L "$CRAFT_DIR/modules/githubdispatch-current" ]; then
            candidate="$(basename "$(readlink "$CRAFT_DIR/modules/githubdispatch-current")")"
            if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
              CURRENT_LINK="$candidate"
            else
              CURRENT_LINK='invalid'
            fi
          fi
          printf 'current_release=%s\n' "$CURRENT_LINK"

          BACKUP_ROOT="$HOME/.val-dieu-deploy-backups"
          while IFS= read -r name; do
            [[ "$name" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]] || continue
            APP_STATE='absent'
            LINK_STATE='absent'
            if [ -f "$BACKUP_ROOT/$name/craft/app.php" ]; then
              APP_STATE="$(sha256sum "$BACKUP_ROOT/$name/craft/app.php" | cut -d' ' -f1)"
            fi
            if [ -f "$BACKUP_ROOT/$name/craft/githubdispatch.previous-link" ]; then
              LINK_STATE='present'
            fi
            printf 'backup=%s app_sha256=%s previous_link=%s\n' "$name" "$APP_STATE" "$LINK_STATE"
          done < <(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort -r | head -n 10)
          REMOTE

      - name: Probe the Craft web bootstrap
        env:
          CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_TARGET_DIR: ${{ secrets.OVH_TARGET_DIR }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -Eeuo pipefail
          : "${CRAFT_API_URL:?Missing CRAFT_API_URL}"
          : "${OVH_HOST:?Missing OVH_HOST}"
          : "${OVH_TARGET_DIR:?Missing OVH_TARGET_DIR}"
          : "${OVH_USER:?Missing OVH_USER}"
          [[ "$OVH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid OVH host' >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" =~ ^(~/|/?)[A-Za-z0-9._/-]+$ ]] || { echo 'Invalid OVH target' >&2; exit 1; }
          [[ "$OVH_TARGET_DIR" != "/" && "$OVH_TARGET_DIR" != "." && "$OVH_TARGET_DIR" != ".." && "$OVH_TARGET_DIR" != *"//"* ]] || { echo 'Unsafe OVH target' >&2; exit 1; }
          case "$OVH_TARGET_DIR" in
            ../*|*/../*|*/..|./*|*/./*|*/.) echo 'Unsafe OVH target' >&2; exit 1 ;;
          esac
          [[ "$OVH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid OVH user' >&2; exit 1; }
          [[ "$CRAFT_API_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?/cms/api/ ]] || { echo 'Invalid Craft API URL' >&2; exit 1; }

          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          SSH_TARGET="$OVH_USER@$OVH_HOST"
          REMOTE_HOME="$(ssh "$SSH_TARGET" 'cd && pwd -P')"
          if [[ "$OVH_TARGET_DIR" == "~/"* ]]; then
            TARGET_FOR_CD="$REMOTE_HOME/${OVH_TARGET_DIR#\~/}"
          else
            TARGET_FOR_CD="$OVH_TARGET_DIR"
          fi
          REMOTE_TARGET="$(ssh "$SSH_TARGET" "cd -- '$TARGET_FOR_CD' && pwd -P")"
          [[ "$REMOTE_HOME" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$REMOTE_TARGET" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$REMOTE_TARGET" == "$REMOTE_HOME/"* && "$REMOTE_TARGET" != "$REMOTE_HOME" ]]
          ssh "$SSH_TARGET" \
            "grep -qxF 'val-dieu-static-root-v1' '$REMOTE_TARGET/.val-dieu-deploy-root' &&
             grep -qxF 'val-dieu-craft-root-v1' '$REMOTE_HOME/craft/.val-dieu-craft-root' &&
             test -f '$REMOTE_TARGET/cms/index.php'"

          REMOTE_PROBE="$REMOTE_TARGET/cms/craft-probe-$RUN_ID.php"
          REMOTE_KEY="$REMOTE_TARGET/cms/craft-probe-$RUN_ID.pem"

          cleanup() {
            ssh "$SSH_TARGET" "rm -f -- '$REMOTE_PROBE' '$REMOTE_KEY'"
          }
          trap cleanup EXIT

          scp .github/craft-web-probe.php "$SSH_TARGET:$REMOTE_PROBE"
          scp .github/craft-web-probe-public.pem "$SSH_TARGET:$REMOTE_KEY"
          ssh "$SSH_TARGET" \
            "chmod 0644 '$REMOTE_PROBE' '$REMOTE_KEY' &&
             php -l '$REMOTE_PROBE' >/dev/null"

          CRAFT_BASE_URL="${CRAFT_API_URL%%/api/*}"
          [[ "$CRAFT_BASE_URL" != "$CRAFT_API_URL" ]]
          RESPONSE="$(curl --silent --show-error --location --max-time 30 \
            --proto '=http,https' --proto-redir '=http,https' \
            -H 'Cache-Control: no-cache' \
            "$CRAFT_BASE_URL/craft-probe-$RUN_ID.php?run=$RUN_ID")"

          if [ "$RESPONSE" = 'ok' ]; then
            echo 'web_probe=ok'
          elif [[ "$RESPONSE" =~ ^encrypted_error=([A-Za-z0-9+/=]+)$ ]]; then
            printf 'encrypted_web_error=%s\n' "${BASH_REMATCH[1]}"
          elif [ "$RESPONSE" = 'encryption-failed' ]; then
            echo 'The Craft web probe could not encrypt its diagnostic.' >&2
            exit 1
          else
            echo 'The Craft web probe returned an unexpected response.' >&2
            exit 1
          fi
